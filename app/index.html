<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>מתכנן הארוחות</title>
    <meta name="description" content="מה אוכלים היום, מה צריך לקנות, ואיך זה מסתדר מול היעדים." />

    <!-- כרום הדפדפן נצבע ב---bg של כל מצב. ערך יחיד יצר פס כהה מעל
         אפליקציה בהירה, או להפך. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f6f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151b" />

    <!-- התקנה למסך הבית. iOS מתעלם מה-manifest ודורש את התגיות שלו. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ארוחות" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

    <!-- הפונטים הם חלק מהזהות ולא קישוט: בלי הטעינה המוקדמת הכותרות
         מהבהבות בפונט המערכת בדיוק בשנייה שבה קוראים אותן. -->
    <link
      rel="preload"
      href="../fonts/Gagua-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="../fonts/Alef_Regular.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- הודעות מצב גלובליות (נעילת סכמה, כשל שמירה) -->
    <div id="banner" class="banner" hidden role="status" aria-live="polite"></div>

    <header class="topbar">
      <h1 id="screen-title">מה אוכלים</h1>
      <p id="screen-sub" class="topbar-sub"></p>
    </header>

    <main>
      <section id="screen-today" class="screen" aria-labelledby="tab-today"></section>
      <section id="screen-week" class="screen" hidden aria-labelledby="tab-week"></section>
      <section id="screen-list" class="screen" hidden aria-labelledby="tab-list"></section>
      <section id="screen-pantry" class="screen" hidden aria-labelledby="tab-pantry"></section>
      <section id="screen-score" class="screen" hidden aria-labelledby="tab-score"></section>
    </main>

    <!-- התדריך. יושב *מעל* סרגל הטאבים ולא מסתיר אותו — הטאב שנדלק
         הוא מד ההתקדמות. נבנה מ-ui-tour.js. -->
    <div id="tour" class="tour" hidden></div>

    <nav class="tabbar" aria-label="ניווט ראשי">
      <button
        id="tab-today"
        class="tab is-active"
        type="button"
        data-screen="today"
        aria-current="page"
      >
        <span class="tab-label">היום</span>
      </button>
      <button id="tab-week" class="tab" type="button" data-screen="week">
        <span class="tab-label">השבוע</span>
      </button>
      <button id="tab-list" class="tab" type="button" data-screen="list">
        <span class="tab-label">קניות</span>
      </button>
      <button id="tab-pantry" class="tab" type="button" data-screen="pantry">
        <span class="tab-label">מזווה</span>
      </button>
      <button id="tab-score" class="tab" type="button" data-screen="score">
        <span class="tab-label">מאקרו</span>
      </button>
    </nav>

    <script>
      // רשת ביטחון: כשל טעינת מודול (למשל מטמון מעורב אחרי פריסה) מציג
      // מסך לבן בלי הסבר. עדיף לומר למשתמש מה לעשות.
      // שלב הלכידה הוא חובה: אירוע כשל של טעינת סקריפט נורה על האלמנט
      // עצמו ואינו מבעבע, כך שמאזין רגיל על window לעולם לא היה נקרא
      // בדיוק במקרה שבשבילו נכתבה הרשת.
      addEventListener(
        "error",
        (event) => {
          if (!(event.target instanceof HTMLScriptElement) && !event.message) return;
          const banner = document.getElementById("banner");
          if (!banner) return;
          banner.textContent =
            "הדף לא נטען כמו שצריך. נסה רענון (ובמובייל — לסגור ולפתוח את הכרטיסייה).";
          banner.hidden = false;
        },
        true,
      );
    </script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
