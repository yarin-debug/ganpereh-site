<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>בדיקות — מתכנן הארוחות</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #f6f5f1;
        color: #23281f;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .note {
        margin: 0 0 16px;
        font-size: 14px;
        color: #5f6b58;
      }
      #summary {
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
        margin-bottom: 14px;
      }
      #summary.pass {
        background: #e8eee4;
        border: 1px solid #47613c;
      }
      #summary.fail {
        background: #fdf6e3;
        border: 1px solid #b8860b;
      }
      .group {
        margin-bottom: 18px;
      }
      .group h2 {
        font-size: 15px;
        color: #5f6b58;
        margin: 0 0 6px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        background: #fff;
        border: 1px solid #dcdcd2;
        border-radius: 10px;
        overflow: hidden;
      }
      li {
        padding: 8px 12px;
        border-bottom: 1px solid #dcdcd2;
        font-size: 14px;
      }
      li:last-child {
        border-bottom: none;
      }
      .mark {
        font-weight: 700;
        margin-inline-end: 8px;
      }
      li.ok .mark {
        color: #47613c;
      }
      li.bad {
        background: #fdf6e3;
      }
      li.bad .mark {
        color: #a33;
      }
      .detail {
        display: block;
        color: #5f6b58;
        font-size: 13px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>בדיקות מנוע — מתכנן הארוחות</h1>
    <p class="note">
      בדיקות ה-store רצות מול מפתח אחסון ייעודי ומנקות אותו בסיום. הדף הזה לעולם לא נוגע בנתוני
      האפליקציה.
    </p>
    <div id="summary">מריץ…</div>
    <div id="results"></div>
    <script type="module" src="tests.js"></script>
  </body>
</html>
